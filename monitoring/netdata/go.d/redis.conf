# Redis collector for the stack's `redis` service (ephemeral, 256mb, allkeys-lru,
# no auth). Surfaces used_memory vs the ceiling, hit/miss ratio, ops/sec,
# connected clients, and evicted_keys — the LRU-eviction signal under a burst.
jobs:
  - name: trayectorias
    address: "redis:6379"
    timeout: 1
    update_every: 5
