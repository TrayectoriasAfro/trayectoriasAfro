# External uptime probe (optional): end-user reachability through the edge, so a
# 5xx/timeout is visible even when origin charts look healthy. Read-only GETs.
jobs:
  - name: site
    url: "https://trayectoriasafro.org/"
    status_accepted:
      - 200
    timeout: 5
    update_every: 10

  - name: api_health
    url: "https://trayectoriasafro.org/api/v2/health/"
    status_accepted:
      - 200
    timeout: 5
    update_every: 10
