# Postgres collector for the stack's `postgres` service.
#
# Credentials are injected into the container env by docker-compose.monitoring.yml
# (compose-interpolated from the root .env). Netdata resolves them here at
# runtime; the password is URI-encoded so special characters are handled.
jobs:
  - name: trayectorias
    dsn: "postgresql://${env:POSTGRES_USER}:${env+urienc:POSTGRES_PASSWORD}@postgres:5432/${env:POSTGRES_DB}?sslmode=disable"
    timeout: 2
    update_every: 5
